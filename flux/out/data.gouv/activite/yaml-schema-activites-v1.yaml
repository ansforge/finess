openapi: 3.0.0
info:
  title: Schéma Activités FINESS
  version: 1.0.0
  description: Schéma OpenAPI du flux Activités, incluant toutes les activités publiables rattachées aux structures publiées

paths: { }

components:
  schemas:
    ActivitesResponse:
      type: object
      required:
        - schemaVersion
        - generatedAt
        - pmej
      properties:
        schemaVersion:
          type: string
          description: Version du schéma utilisée pour générer le fichier.
        generatedAt:
          type: string
          format: date-time
          description: Horodatage de génération du fichier au format ISO 8601.
        pmej:
          type: array
          items:
            $ref: '#/components/schemas/PmejActivites'

    PmejActivites:
      type: object
      required:
        - numFiness
        - pmSmsseId
      properties:
        numFiness:
          $ref: '#/components/schemas/FinessId'
        pmSmsseId:
          type: string
        activitesAutorisees:
          type: array
          items:
            $ref: '#/components/schemas/ActiviteAutorisee'
        ege:
          type: array
          items:
            $ref: '#/components/schemas/EgeActivites'

    EgeActivites:
      type: object
      required:
        - egeId
        - numFinessEge
      properties:
        egeId:
          type: string
        numFinessEge:
          $ref: '#/components/schemas/FinessId'
        activitesExercees:
          type: array
          items:
            $ref: '#/components/schemas/ActiviteExercee'

    ActiviteAutorisee:
      allOf:
        - $ref: '#/components/schemas/ActiviteBase'
        - type: object
          properties:
            caracteristiquesGeneriques:
              $ref: '#/components/schemas/CaracteristiquesGeneriquesAutorisee'
            evenement:
              type: array
              items:
                $ref: '#/components/schemas/Evenement'
            engagement:
              type: array
              items:
                $ref: '#/components/schemas/Engagement'
            capacite:
              type: array
              items:
                $ref: '#/components/schemas/Capacite'
            zoneIntervention:
              $ref: '#/components/schemas/ZoneIntervention'
          required:
            - evenement

    ActiviteExercee:
      allOf:
        - $ref: '#/components/schemas/ActiviteBase'
        - type: object
          properties:
            caracteristiquesGeneriques:
              $ref: '#/components/schemas/CaracteristiquesGeneriquesExercee'
            evenement:
              type: array
              items:
                $ref: '#/components/schemas/Evenement'
            engagement:
              type: array
              items:
                $ref: '#/components/schemas/Engagement'
            capacite:
              type: array
              items:
                $ref: '#/components/schemas/Capacite'
            zoneIntervention:
              $ref: '#/components/schemas/ZoneIntervention'
          required:
            - evenement

    ActiviteBase:
      type: object
      required:
        - caracteristiquesGeneriques
        - nature
      properties:
        caracteristiquesGeneriques:
          $ref: '#/components/schemas/CaracteristiquesGeneriques'
        nature:
          $ref: '#/components/schemas/NatureActiviteBase'

    CaracteristiquesGeneriques:
      type: object
      required:
        - activiteAeId
        - etatObjet
        - dateDebutActiviteAutorisee
        - typeActiviteSMSSE
      properties:
        activiteAeId:
          type: string
        etatObjet:
          type: string
          description: État de l'objet administratif
        identifiantAutorisation:
          type: string
        numAutorisationArhgos:
          type: string
        dateDebutActiviteAutorisee:
          type: string
        dateFinActiviteAutorisee:
          type: string
        dateFinEffectiveActivite:
          type: string
        dateCaduciteAutorisation:
          type: string
        egeId:
          type: string
        typeActiviteSMSSE:
          type: string
          description: Type d'activité SMSSE régulée

    CaracteristiquesGeneriquesAutorisee:
      allOf:
        - $ref: '#/components/schemas/CaracteristiquesGeneriques'
        - type: object
          properties:
            pmSmsseExploitanteId:
              type: string
              description: Identifiant interne de la PMEJ exploitante (pmSmsseId)

    CaracteristiquesGeneriquesExercee:
      allOf:
        - $ref: '#/components/schemas/CaracteristiquesGeneriques'
        - type: object
          properties:
            identifiantAutorisation:
              type: string
            egeId:
              type: string
            egeExploitanteId:
              type: string
              description: Identifiant de l'EGE exploitante
            egeFacturante:
              type: string
              enum:
                - O
                - N
              description: Indique si l'EGE est facturante (O/N)
          required:
            - identifiantAutorisation
            - egeId

    #    NatureActivite:
    #      oneOf:
    #        - $ref: '#/components/schemas/NatureActiviteAASA'
    #        - $ref: '#/components/schemas/NatureActiviteASR'
    #        - $ref: '#/components/schemas/NatureActiviteEML'
    #        - $ref: '#/components/schemas/NatureActiviteASDR'
    #        - $ref: '#/components/schemas/NatureActiviteASOCR'
    #        - $ref: '#/components/schemas/NatureActiviteAMSR'
    #        - $ref: '#/components/schemas/NatureActiviteAER'
    #        - $ref: '#/components/schemas/NatureActiviteAMF'
    #        - $ref: '#/components/schemas/NatureActiviteAMM'
    #      discriminator:
    #        propertyName: codeNature

    NatureActiviteBase:
      type: object
      properties:
        codeNature:
          type: string
          enum: [ AASA, ASR, EML, ASDR, ASOCR, AMSR, AER, AMF, AMM ]
          description: Code nature de l'activité
      required:
        - codeNature
      discriminator:
        propertyName: codeNature

    NatureActiviteAASA:
      allOf:
        - $ref: '#/components/schemas/NatureActiviteBase'
        - type: object
          required:
            - caracteristiquesSpecifiques
          properties:
            caracteristiquesSpecifiques:
              $ref: '#/components/schemas/CaracteristiquesSpecifiquesAASA'

    NatureActiviteASR:
      allOf:
        - $ref: '#/components/schemas/NatureActiviteBase'
        - type: object
          required:
            - caracteristiquesSpecifiques
          properties:
            caracteristiquesSpecifiques:
              $ref: '#/components/schemas/CaracteristiquesSpecifiquesASR'

    NatureActiviteEML:
      allOf:
        - $ref: '#/components/schemas/NatureActiviteBase'
        - type: object
          required:
            - caracteristiquesSpecifiques
          properties:
            caracteristiquesSpecifiques:
              $ref: '#/components/schemas/CaracteristiquesSpecifiquesEML'

    NatureActiviteASDR:
      allOf:
        - $ref: '#/components/schemas/NatureActiviteBase'
        - type: object
          required:
            - caracteristiquesSpecifiques
          properties:
            caracteristiquesSpecifiques:
              $ref: '#/components/schemas/CaracteristiquesSpecifiquesASDR'

    NatureActiviteASOCR:
      allOf:
        - $ref: '#/components/schemas/NatureActiviteBase'
        - type: object
          required:
            - caracteristiquesSpecifiques
          properties:
            caracteristiquesSpecifiques:
              $ref: '#/components/schemas/CaracteristiquesSpecifiquesASOCR'

    NatureActiviteAMSR:
      allOf:
        - $ref: '#/components/schemas/NatureActiviteBase'
        - type: object
          required:
            - caracteristiquesSpecifiques
          properties:
            caracteristiquesSpecifiques:
              $ref: '#/components/schemas/CaracteristiquesSpecifiquesAMSR'

    NatureActiviteAER:
      allOf:
        - $ref: '#/components/schemas/NatureActiviteBase'
        - type: object
          required:
            - caracteristiquesSpecifiques
          properties:
            caracteristiquesSpecifiques:
              $ref: '#/components/schemas/CaracteristiquesSpecifiquesAER'

    NatureActiviteAMF:
      allOf:
        - $ref: '#/components/schemas/NatureActiviteBase'
        - type: object
          required:
            - caracteristiquesSpecifiques
          properties:
            caracteristiquesSpecifiques:
              $ref: '#/components/schemas/CaracteristiquesSpecifiquesAMF'

    NatureActiviteAMM:
      allOf:
        - $ref: '#/components/schemas/NatureActiviteBase'
        - type: object
          required:
            - caracteristiquesSpecifiques
          properties:
            caracteristiquesSpecifiques:
              $ref: '#/components/schemas/CaracteristiquesSpecifiquesAMM'

    CaracteristiquesSpecifiquesAASA:
      type: object
      required:
        - aaAutreActSoinId
        - activiteAeId
        - typeActiviteAASA
      properties:
        aaAutreActSoinId:
          type: string
        dateLimDep:
          type: string
        dateLimVisiteConformite:
          type: string
        dateVisite:
          type: string
        numDecision:
          type: string
        resultatVisite:
          type: string
        etatArhgos:
          type: string
        activiteAeId:
          type: string
        typeActiviteAASA:
          $ref: '#/components/schemas/TypeActiviteAASA'

    TypeActiviteAASA:
      type: object
      required:
        - activiteSanitaireRegulee
        - modaliteActivite
        - formeActivite
      properties:
        activiteSanitaireRegulee:
          type: string
          description: Activité sanitaire régulée
        modaliteActivite:
          type: string
          description: Modalité d'activité
        formeActivite:
          type: string
          description: Forme d'activité

    CaracteristiquesSpecifiquesASR:
      type: object
      required:
        - aaSoumiseAReconnaissanceId
        - activiteAeId
        - typeActiviteASR
      properties:
        aaSoumiseAReconnaissanceId:
          type: string
        etatArhgos:
          type: string
        activiteAeId:
          type: string
        typeActiviteASR:
          $ref: '#/components/schemas/TypeActiviteASR'

    TypeActiviteASR:
      type: object
      required:
        - activiteSanitaireRegulee
        - modaliteActivite
        - formeActivite
      properties:
        activiteSanitaireRegulee:
          type: string
        modaliteActivite:
          type: string
        formeActivite:
          type: string

    CaracteristiquesSpecifiquesEML:
      type: object
      required:
        - aaEmlId
        - activiteAeId
        - typeActiviteEML
      properties:
        aaEmlId:
          type: string
        marque:
          type: string
        numeroSerie:
          type: string
        activiteAeId:
          type: string
        typeActiviteEML:
          $ref: '#/components/schemas/TypeActiviteEML'

    TypeActiviteEML:
      type: object
      required:
        - typeEmlId
      properties:
        typeEmlId:
          type: string
          description: Type d'équipement matériel lourd

    CaracteristiquesSpecifiquesASDR:
      type: object
      required:
        - aaSanitaireDiverseReguleeId
        - activiteAeId
        - typeActiviteASDR
      properties:
        aaSanitaireDiverseReguleeId:
          type: string
        activiteAeId:
          type: string
        typeActiviteASDR:
          $ref: '#/components/schemas/TypeActiviteASDR'

    TypeActiviteASDR:
      type: object
      required:
        - activiteSanitaireDiverseRegulee
        - modeFonctionnement
        - public
      properties:
        activiteSanitaireDiverseRegulee:
          type: string
          description: Activité sanitaire diverse régulée
        modeFonctionnement:
          type: string
          description: Mode de fonctionnement
        public:
          type: string
          description: Public visé

    CaracteristiquesSpecifiquesASOCR:
      type: object
      required:
        - aaSocialeReguleeId
        - activiteAeId
        - typeActiviteASOCR
      properties:
        aaSocialeReguleeId:
          type: string
        ageMaxAutorise:
          type: string
        ageMaxInstalle:
          type: string
        ageMinAutorise:
          type: string
        ageMinInstalle:
          type: string
        activiteAeId:
          type: string
        typeActiviteASOCR:
          $ref: '#/components/schemas/TypeActiviteASOCR'

    TypeActiviteASOCR:
      type: object
      required:
        - activiteSocialeRegulee
        - modeFonctionnement
        - public
      properties:
        activiteSocialeRegulee:
          type: string
          description: Activité sociale régulée
        modeFonctionnement:
          type: string
          description: Mode de fonctionnement
        public:
          type: string
          description: Public visé

    CaracteristiquesSpecifiquesAMSR:
      type: object
      required:
        - aaSocialeReguleeId
        - activiteAeId
        - typeActiviteAMSR
      properties:
        aaSocialeReguleeId:
          type: string
        ageMaxAutorise:
          type: string
        ageMaxInstalle:
          type: string
        ageMinAutorise:
          type: string
        ageMinInstalle:
          type: string
        activiteAeId:
          type: string
        typeActiviteAMSR:
          $ref: '#/components/schemas/TypeActiviteAMSR'

    TypeActiviteAMSR:
      type: object
      required:
        - activiteSocialeRegulee
        - modeFonctionnement
        - public
      properties:
        activiteSocialeRegulee:
          type: string
        modeFonctionnement:
          type: string
        public:
          type: string

    CaracteristiquesSpecifiquesAER:
      type: object
      required:
        - activiteAeId
        - typeActiviteAER
      properties:
        activiteAeId:
          type: string
        typeActiviteAER:
          $ref: '#/components/schemas/TypeActiviteAER'

    TypeActiviteAER:
      type: object
      required:
        - activiteEnseignementRegulee
        - modeFonctionnement
        - public
      properties:
        activiteEnseignementRegulee:
          type: string
          description: Activité d'enseignement régulée
        modeFonctionnement:
          type: string
        public:
          type: string

    CaracteristiquesSpecifiquesAMF:
      type: object
      required:
        - aaSoinAmfId
        - activiteAeId
        - typeActiviteAMF
      properties:
        aaSoinAmfId:
          type: string
        activiteAeId:
          type: string
        typeActiviteAMF:
          $ref: '#/components/schemas/TypeActiviteAMF'

    TypeActiviteAMF:
      type: object
      required:
        - activiteAMF
        - modaliteActivite
        - formeActivite
      properties:
        activiteAMF:
          type: string
          description: Activité AMF
        modaliteActivite:
          type: string
        formeActivite:
          type: string

    CaracteristiquesSpecifiquesAMM:
      type: object
      required:
        - aaSoinAmmId
        - activiteAeId
        - typeActiviteAMM
      properties:
        aaSoinAmmId:
          type: string
        activiteAeId:
          type: string
        appareil:
          type: array
          items:
            $ref: '#/components/schemas/AppareilAMM'
        typeActiviteAMM:
          $ref: '#/components/schemas/TypeActiviteAMM'

    AppareilAMM:
      type: object
      required:
        - typeAppareilAMM
        - statutAppareilAMM
        - nombreAppareilAMM
      properties:
        typeAppareilAMM:
          type: string
          description: Type d'appareil AMM
        statutAppareilAMM:
          type: string
          description: Statut de l'appareil
        nombreAppareilAMM:
          type: string
          description: Nombre d'appareils

    TypeActiviteAMM:
      type: object
      required:
        - activiteAMM
        - modaliteAMM
        - mentionAMM
        - ptsAMM
        - declarationAMM
      properties:
        activiteAMM:
          type: string
          description: Activité AMM
        modaliteAMM:
          type: string
          description: Modalité AMM
        mentionAMM:
          type: string
          description: Mention AMM
        ptsAMM:
          type: string
          description: Pratique thérapeutique spécifique
        declarationAMM:
          type: string
          description: Déclaration AMM

    Evenement:
      type: object
      required:
        - evenementId
        - dateEnregistrement
        - dateEvenement
        - etatObjet1
        - identifiantObjet1
        - systemeMaitre
        - typeObjet1
        - codeEvenement
      properties:
        evenementId:
          type: string
        dateEnregistrement:
          type: string
        dateEvenement:
          type: string
        etatObjet1:
          type: string
          description: État de l'objet
        identifiantObjet1:
          type: string
        identifiantObjet2:
          type: string
        systemeMaitre:
          type: string
          description: Système maître
        typeObjet1:
          type: string
          description: Type d'objet 1
        typeObjet2:
          type: string
          description: Type d'objet 2
        codeEvenement:
          type: string
          description: Code d'événement administratif

    Engagement:
      type: object
      required:
        - engagementId
        - typeEngagement
        - sousTypeEngagement
        - dateEffetEngagement
      properties:
        engagementId:
          type: string
        typeEngagement:
          type: string
          description: Type d'engagement
        sousTypeEngagement:
          type: string
          description: Sous-type d'engagement
        dateEffetEngagement:
          type: string
        dateSignatureEngagement:
          type: string
        dateCaduciteEngagement:
          type: string
        dateFinEngagement:
          type: string
        dateNotificationEngagement:
          type: string
        nomEngagement:
          type: string
        identifiantEngagement:
          type: string
        motifArrete:
          type: string
          description: Motif d'arrêté
        autoriteRegulationEngagement:
          type: array
          items:
            $ref: '#/components/schemas/AutoriteRegulation'

    AutoriteRegulation:
      type: object
      properties:
        autoriteRegulationid:
          type: string
          description: Identifiant de l'autorité de régulation

    Capacite:
      type: object
      required:
        - idCapacite
        - nombre
        - statutCapacite
        - uniteMesureCapacite
      properties:
        idCapacite:
          type: string
        nombre:
          type: string
        precision:
          type: string
        variation:
          type: string
        activiteAeId:
          type: string
        engagementId:
          type: string
        habilitation:
          type: string
          description: Aide financière
        statutCapacite:
          type: string
          description: Statut de la capacité
        modeFinancement:
          type: string
          description: Mode de financement
        uniteMesureCapacite:
          type: string
          description: Nature de la capacité
        typeLogement:
          type: string
          description: Type de logement
        genre:
          type: string
          description: Genre de capacité

    ZoneIntervention:
      type: object
      required:
        - zoneInterventionAutoriseeId
        - activiteAeId
        - communeZI
      properties:
        zoneInterventionAutoriseeId:
          type: string
        libelleZI:
          type: string
        activiteAeId:
          type: string
        communeZI:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CommuneZI'

    CommuneZI:
      type: object
      required:
        - commune
      properties:
        commune:
          type: string
          description: Code commune

    FinessId:
      type: string
      pattern: '^[A-Za-z0-9]{9}$'
      description: Numéro FINESS alphanumérique sur 9 caractères


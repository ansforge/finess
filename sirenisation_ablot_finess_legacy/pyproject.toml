[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sirenisation-ablot"
version = "0.1.0"
description = "Reproducible FINESS–Sirene review and analysis workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipython>=9,<10",
    "jupyterlab>=4,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pyarrow>=19,<24",
    "scikit-learn>=1.9.0",
    "statsmodels>=0.14.6",
    "unidecode>=1.3,<2",
]

[tool.setuptools]
py-modules = ["project_config"]
packages = ["source_preprocessing"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
